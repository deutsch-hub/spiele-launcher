<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wortarten-Metro</title>
  <link rel="stylesheet" href="../../css/main.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="game-page">
  <header>
    <a href="../../index.html" class="logo-text">Deutsch-Spiele Hub</a>
    <details class="site-menu">
      <summary aria-label="Navigation öffnen"></summary>
      <nav class="site-menu-links" aria-label="Hauptnavigation">
        <a href="../../index.html">Spiele</a>
        <a href="../../fragensets.html">Fragensets</a>
      </nav>
    </details>
  </header>

  <main class="metro-container">
    <section id="main-menu" class="metro-screen">
      <h1>Wortarten-Metro</h1>
      <img class="metro-image metro-image-menu" src="resource/wortartenMetroV1.1.jpg" alt="Wortarten-Metro">
      <div class="metro-actions">
        <button class="btn" onclick="showScreen('game-setup')">Spiel starten</button>
      </div>
      <a href="../../index.html" class="btn btn-secondary">Zurück zur Spieleauswahl</a>
    </section>

    <section id="game-setup" class="metro-screen" style="display: none;">
      <h1>Spiel starten</h1>
      <div class="editor-card setup-card">
        <label for="select-set-game">Kartenset:</label>
        <select id="select-set-game"></select>
        <button class="btn" onclick="startGame()">Spiel starten</button>
      </div>
      <button class="btn btn-secondary" onclick="showScreen('main-menu')">Zurück</button>
    </section>

    <section id="game-screen" class="metro-screen" style="display: none;">
      <div class="metro-game-layout">
        <img class="metro-image" src="resource/wortartenMetroV1.1.jpg" alt="Wortarten-Metro Karte">
        <div class="metro-game-controls">
          <div class="card-stack" aria-live="polite">
            <div class="sentence-card card-backdrop"></div>
            <div class="sentence-card card-backdrop card-backdrop-small"></div>
            <article id="sentence-card" class="sentence-card" onclick="flipCard()" onkeydown="if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); flipCard(); }" role="button" tabindex="0" aria-label="Satzkarte umdrehen">
              <div class="card-face card-front">
                <span class="card-label">Satz-Karte</span>
                <p id="sentence-text">Ziehe eine Satz-Karte.</p>
              </div>
              <div class="card-face card-back">
                <span class="card-label">Lösung</span>
                <p id="solution-text"></p>
              </div>
            </article>
          </div>
          <div class="metro-actions">
            <button class="btn" onclick="drawSentence()">Neue Satz-Karte ziehen</button>
          </div>
          <a class="btn btn-secondary" href="../../index.html">Zurück zur Spieleauswahl</a>
        </div>
      </div>
    </section>

    <section id="editor-screen" class="metro-screen" style="display: none;">
      <h1>Karten einstellen</h1>
      <div class="editor-card">
        <h2>Kartenset auswählen oder anlegen</h2>
        <div class="editor-inline">
          <input id="new-set-name" type="text" placeholder="z. B. Klasse 7">
          <button class="btn" onclick="createNewSet()">Set erstellen</button>
        </div>
        <div class="form-group">
          <label for="select-active-set">Aktives Set:</label>
          <select id="select-active-set" onchange="loadActiveSet()"></select>
        </div>
        <div class="editor-actions">
          <button class="btn btn-secondary" type="button" onclick="exportMetroSets()">Kartensets herunterladen</button>
          <button class="btn btn-secondary" type="button" onclick="document.getElementById('import-file').click()">Kartensets hochladen</button>
          <input id="import-file" type="file" hidden accept=".json,application/json" onchange="importMetroSets(event)">
        </div>
      </div>

      <div id="question-form-card" class="editor-card" style="display: none;">
        <h2>Neue Satz-Karte hinzufügen</h2>
        <form id="question-form" onsubmit="addSentence(event)">
          <div class="form-group">
            <label for="sentence-input">Satz / Aufgabe</label>
            <textarea id="sentence-input" required placeholder="Das ist ein schöner Testsatz"></textarea>
          </div>
          <div class="form-group">
            <label for="solution-input">Lösung</label>
            <textarea id="solution-input" required placeholder="Das = Artikel-Linie, ist = Verb-Linie, Umstieg an Station ..."></textarea>
          </div>
          <button id="sentence-submit-button" class="btn" type="submit">Satz-Karte speichern</button>
          <button id="cancel-sentence-edit-button" class="btn btn-secondary" type="button" onclick="cancelSentenceEdit()" hidden>Bearbeiten abbrechen</button>
        </form>
        <h2 class="question-list-heading">Enthaltene Satz-Karten</h2>
        <div id="questions-list"></div>
      </div>

      <div class="metro-actions">
        <a class="btn btn-secondary" href="../../index.html">Zurück zur Spieleauswahl</a>
      </div>
    </section>
  </main>

  <script src="storage.js"></script>
  <script src="metro.js"></script>
</body>
</html>
